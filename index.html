<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Kosher Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a personal tool used on the go, mostly on a phone
   IDEA a deli order pad: each place is a slip you tick, the counter tallies at the top
   PICTURE the live list itself, under a paprika band that tallies picks per region
   COLOUR paprika band, white pad, near-black ink; status colours from the Sheet; saffron star
   TYPE Archivo 800 for names and title, Inter for text
   LAYOUT laptop: band with tabs and tally, sticky filter bar, 2-3 columns of slips; phone: one column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16110f);--ink:light-dark(#1b1512,#f3ece8);--mute:light-dark(#6b5f58,#b3a69e);--line:light-dark(#e7dfda,#3a2f2a);--card:light-dark(#ffffff,#1f1815);--band:light-dark(#b8321f,#7a2416);--bandink:#fff6f1;--star:#f0b429;--yes:light-dark(#cdeccf,#1f4a27);--yesI:light-dark(#18602a,#bff0c8);--may:light-dark(#fbeaa6,#4d4113);--mayI:light-dark(#6b5200,#ffe68a);--no:light-dark(#e4e1df,#3a3634);--noI:light-dark(#4a4441,#d7d1cd);--been:light-dark(#cfe0fb,#1c3557);--beenI:light-dark(#1b4b8f,#c4dbff);--meat:light-dark(#9c2a1a,#ff9a85);--dairy:light-dark(#1d58a8,#9cc4ff);--pareve:light-dark(#2f6f3a,#9fe0aa)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.band{background:var(--band);color:var(--bandink);padding:22px max(4vw,16px) 0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;max-width:1240px;margin:0 auto}
h1{font:800 clamp(32px,5vw,46px)/1.05 Archivo,Inter,sans-serif;letter-spacing:-.02em;margin:0}
.sync{font-size:13px;opacity:.85;min-height:20px}
.tally{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.tally b{font:800 24px/1 Archivo,sans-serif;display:block}
.tabs{display:flex;gap:4px;max-width:1240px;margin:18px auto 0;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:transparent;color:var(--bandink);padding:12px 16px 14px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:600;min-height:44px;opacity:.85}
.tab small{font-weight:500;opacity:.8;margin-left:6px}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.tab:focus-visible,.chip:focus-visible,.st button:focus-visible,input:focus-visible,select:focus-visible,.maps:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.prog{max-width:1240px;margin:0 auto;padding:6px max(4vw,16px) 0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(4vw,16px)}
.tin{max-width:1240px;margin:0 auto;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#q{flex:1 1 220px;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--card);font-size:16px}
select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-size:15px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:38px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-size:14px;font-weight:600}
.gm{border:0;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--band);color:var(--bandink);text-decoration:none;font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--mute);flex-basis:100%}
.mi{color:var(--ink);font-weight:600}
[hidden]{display:none!important}
.count{font-size:14px;color:var(--mute);margin-left:auto;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:18px max(4vw,16px) 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.grp{font:800 22px/1.1 Archivo,sans-serif;margin:26px 0 12px;grid-column:1/-1}
.grp:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--edge,var(--line))}
.card[data-s=Yes]{--edge:#3f9c52}.card[data-s=Maybe]{--edge:#e0b21b}.card[data-s=No]{--edge:#a39b96;opacity:.72}.card[data-s="Been there"]{--edge:#3d7bd6}
.nm{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.nm h3{font:800 19px/1.2 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
.star{color:var(--star);font-size:18px;flex:none}
.meta{font-size:14px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.tags span{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tags .k{border-color:currentColor;font-weight:600}
.k.Meat{color:var(--meat)}.k.Dairy,.k.Dairy\/Fish{color:var(--dairy)}.k.Pareve{color:var(--pareve)}
.note{font-size:13px;color:var(--mute);font-style:italic}
.maps{font-size:14px;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.st button{border:1px solid var(--line);background:transparent;border-radius:8px;min-height:40px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute);padding:0 4px}
.st button[aria-pressed=true][data-v=Yes]{background:var(--yes);color:var(--yesI);border-color:transparent}
.st button[aria-pressed=true][data-v=Maybe]{background:var(--may);color:var(--mayI);border-color:transparent}
.st button[aria-pressed=true][data-v=No]{background:var(--no);color:var(--noI);border-color:transparent}
.st button[aria-pressed=true][data-v="Been there"]{background:var(--been);color:var(--beenI);border-color:transparent}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;transition:transform .25s;z-index:9;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;background:var(--star);color:#1b1512;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;min-height:36px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.tally{gap:14px}.count{margin-left:0;width:100%}.tools{padding-block:10px}}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <div><h1>Kosher wishlist</h1><div class="sync" id="sync">Loading your picks…</div></div>
    <div class="tally" id="tally"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="prog"><div class="bar" id="bar"></div><div class="legend" id="legend"></div></div>
<div class="tools">
  <div class="tin">
    <div class="row">
      <input id="q" type="search" placeholder="Search name, cuisine, area, hechsher" aria-label="Search">
      <select id="area" aria-label="Area"></select>
      <select id="sort" aria-label="Sort">
        <option value="area">Sort: by area</option>
        <option value="buzz">Sort: buzz first</option>
        <option value="name">Sort: A to Z</option>
      </select>
    </div>
    <div class="row" id="nearbox" hidden>
      <label class="lbl" for="near">I'm near</label>
      <select id="near"></select>
      <select id="rad" aria-label="Distance">
        <option value="2">within 2 mi</option><option value="5">within 5 mi</option><option value="10">within 10 mi</option><option value="20">within 20 mi</option><option value="40">within 40 mi</option>
      </select>
      <button class="gm" id="locate" type="button">Use my location</button>
      <span class="hint">Distances are straight-line to each neighborhood or town center, so treat them as rough.</span>
    </div>
    <div class="row" id="chips"></div>
  </div>
</div>
<main><div class="grid" id="list"></div></main>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">Undo</button></div>

, "nyc-hapisgah": "No", "nyc-holy-schnitzel-queens": "No", "nyc-jewel-bagel": "No", "nyc-main-street-bagels": "No", "nyc-mama-kitchen-queens": "Yes", "nyc-max-and-mina-s": "Maybe", "nyc-mechy-s-deli": "Maybe", "nyc-naomi-s-kosher-pizza": "No", "nyc-pizza-professor": "No", "nyc-smash-house-burgers-queens": "Maybe", "nyc-soy-sauce": "No", "nyc-tel-aviv-kebab-house": "Yes", "nyc-the-sandwich-bar": "No", "nyc-the-upper-crust": "No", "nyc-top-notch-sushi": "No", "nyc-turnpike-burger-grill": "Yes", "nyc-urban-press": "No", "nyc-art-of-grill": "Yes", "nyc-chaikhana": "Yes", "nyc-cheburechnaya": "Yes", "nyc-fortune-chinese-rego-park": "No", "nyc-imperial": "No", "nyc-l-chaim": "Yes", "nyc-marani": "Yes", "nyc-mezze-pizzeria": "No", "nyc-prestige-restaurant": "Yes", "nyc-tandoori-bukharian-bakery": "Yes", "nyc-taste-of-samarkand": "Yes", "nyc-carlos-gabby-s-riverdale": "Maybe", "nyc-kai-fan": "No", "nyc-liebman-s-kosher-deli": "Been there", "nyc-moss-cafe": "Yes", "nyc-pizza-block": "No", "nyc-riverdale-second-helping": "No", "nyc-kosher-express": "No", "bergen-sheinkin": "Yes", "bergen-zula": "Been there", "bergen-seoul-bite": "Been there", "bergen-estihana": "Been there", "bergen-dougie-s-bbq": "Been there", "bergen-sushi-metsuyan": "Been there", "bergen-zevy-s-pizza": "Been there", "monsey-the-diner": "Been there"};
const picks = {};
const st = {tab:"nyc", q:"", area:"", sort:"area", status:"all", kind:"all", star:false, near:"home", rad:10};
try{ const s = JSON.parse(localStorage.getItem("kw-ui")||"{}"); Object.assign(st, s, {q:""}); if(st.near==="gps") st.near="home"; }catch(e){}
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db = null, local = false, last = null, tt = 0;

const STATUS_CHIPS = [["all","All"],["Yes","Yes"],["Maybe","Maybe"],["none","Not marked"],["Been there","Been there"],["No","No"]];
const KIND_CHIPS = [["all","Any type"],["Meat","Meat"],["Dairy","Dairy"],["Pareve","Pareve"]];

const DIST = {};
let GPS = null;
function here(){ if(st.near==="gps" && GPS) return GPS; return (PLACES.find(p=>p[0]===st.near)||PLACES[0])[2]; }
function rows(){
  if(st.tab==="mine") return DATA.filter(r => picks[r.id]==="Yes");
  if(st.tab==="near"){ const c = here(); const out = []; DATA.forEach(r => { const g = geo(r); if(!g) return; const d = miles(c,g); DIST[r.id]=d; if(d<=st.rad) out.push(r); }); return out.sort((a,b)=>DIST[a.id]-DIST[b.id]); }
  return DATA.filter(r => r.r===st.tab);
}
function saveUi(){ try{ localStorage.setItem("kw-ui", JSON.stringify({tab:st.tab,sort:st.sort,status:st.status,kind:st.kind,star:st.star,area:st.area,near:st.near,rad:st.rad})); }catch(e){} }

function renderTabs(){
  $("tabs").innerHTML = Object.keys(REG).map(k => {
    const n = k==="mine" ? DATA.filter(r=>picks[r.id]==="Yes").length : k==="near" ? "" : DATA.filter(r=>r.r===k).length;
    return `<button class="tab" role="tab" type="button" data-t="${k}" aria-selected="${st.tab===k}">${REG[k]}<small>${n}</small></button>`;
  }).join("");
}
function renderTally(){
  const base = st.tab==="mine" ? DATA : rows();
  const c = {Yes:0,Maybe:0,No:0,"Been there":0};
  base.forEach(r => { const p = picks[r.id]; if(p) c[p]++; });
  const total = base.length, open = total - c.Yes - c.Maybe - c.No - c["Been there"];
  $("tally").innerHTML = `<div><b>${c.Yes}</b>want to go</div><div><b>${c.Maybe}</b>maybe</div><div><b>${c["Been there"]}</b>been there</div>`;
  $("bar").innerHTML = ST.map(s => `<i style="width:${total?c[s]/total*100:0}%;background:${COL[s]}"></i>`).join("");
  $("legend").innerHTML = ST.map(s => `<span style="--c:${COL[s]}">${s} ${c[s]}</span>`).join("") + `<span style="--c:var(--line)">Not marked ${open}</span>` + (st.tab==="mine" ? `<span style="--c:transparent">All regions</span>` : "");
}
function renderNear(){
  const on = st.tab==="near";
  $("nearbox").hidden = !on; $("area").hidden = on; $("sort").hidden = on;
  if(!on) return;
  $("near").innerHTML = (GPS?`<option value="gps" ${st.near==="gps"?"selected":""}>My current location</option>`:"") + PLACES.map(p => `<option value="${esc(p[0])}" ${p[0]===st.near?"selected":""}>${esc(p[1])}</option>`).join("");
  $("rad").value = String(st.rad);
}
function renderAreas(){
  const list = [...new Set(rows().map(r => r.a))].sort();
  if(st.area && !list.includes(st.area)) st.area = "";
  $("area").innerHTML = `<option value="">${st.tab==="nyc"?"All boroughs":"All towns"}</option>` + list.map(a => `<option ${a===st.area?"selected":""}>${esc(a)}</option>`).join("");
}
function renderChips(){
  const c1 = STATUS_CHIPS.map(([v,l]) => `<button class="chip" type="button" data-g="status" data-v="${v}" aria-pressed="${st.status===v}">${l}</button>`).join("");
  const c2 = KIND_CHIPS.map(([v,l]) => `<button class="chip" type="button" data-g="kind" data-v="${v}" aria-pressed="${st.kind===v}">${l}</button>`).join("");
  const c3 = `<button class="chip" type="button" data-g="star" aria-pressed="${st.star}">★ Buzz only</button>`;
  $("chips").innerHTML = c1 + c2 + c3 + `<span class="count" id="count"></span>`;
}
function mapUrl(r){
  const city = r.r==="nyc" ? `${r.a}, NY` : "";
  const q = [r.n.replace(/\s*\(.*?\)\s*/g," ").trim(), r.ad && !/sources differ|Barclays/.test(r.ad) ? r.ad : "", city || (r.ad?"":r.a)].filter(Boolean).join(", ");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function card(r){
  const p = picks[r.id] || "";
  const where = [r.a, r.h].filter(Boolean).join(" · ");
  return `<article class="card" data-s="${p}">
    <div class="nm"><h3>${esc(r.n)}</h3>${r.s?'<span class="star" title="Top buzz">★</span>':""}</div>
    <div class="meta">${st.tab==="near"?`<b class="mi">~${DIST[r.id]<1?"&lt;1":DIST[r.id].toFixed(1)} mi</b> · `:""}${esc(where)}${st.tab==="mine"||st.tab==="near"?` · ${REG[r.r]}`:""}</div>
    <div class="tags">${r.m?`<span class="k ${esc(r.m)}">${esc(r.m)}</span>`:""}${r.q?`<span>${esc(r.q)}</span>`:""}${r.c?`<span>${esc(r.c)}</span>`:""}${r.k?`<span>${esc(r.k)}</span>`:""}</div>
    ${r.no?`<div class="note">${esc(r.no)}</div>`:""}
    <a class="maps" href="${mapUrl(r)}" target="_blank" rel="noopener">${esc(r.ad || "Find on Google Maps")} ↗</a>
    <div class="st" role="group" aria-label="Pick for ${esc(r.n)}">${ST.map(s => `<button type="button" data-id="${r.id}" data-v="${s}" aria-pressed="${p===s}">${s==="Been there"?"Been":s}</button>`).join("")}</div>
  </article>`;
}
function renderList(){
  const q = st.q.trim().toLowerCase();
  let list = rows().filter(r => {
    const p = picks[r.id];
    if(st.status==="none" ? p : st.status!=="all" && p!==st.status) return false;
    if(st.kind!=="all" && !(r.m||"").startsWith(st.kind)) return false;
    if(st.star && !r.s) return false;
    if(st.area && r.a!==st.area) return false;
    if(q && ![r.n,r.a,r.h,r.q,r.c,r.k,r.ad].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  if(st.tab!=="near" && st.sort==="name") list = [...list].sort((a,b) => a.n.localeCompare(b.n));
  if(st.tab!=="near" && st.sort==="buzz") list = [...list].sort((a,b) => (b.s||0)-(a.s||0));
  $("count").textContent = `${list.length} of ${rows().length} places`;
  if(!list.length){
    $("list").innerHTML = `<div class="empty">${st.tab==="mine"?"Nothing marked Yes yet. Tap Yes on any place to add it here.":st.tab==="near"?"Nothing within this distance. Try a wider radius.":"No places match these filters."}</div>`;
    return;
  }
  let html = "", g = null;
  const grouped = st.tab!=="near" && (st.sort==="area" || st.tab==="mine");
  list.forEach(r => {
    const key = st.tab==="mine" ? REG[r.r] : r.a;
    if(grouped && key!==g){ g = key; html += `<h2 class="grp">${esc(g)}</h2>`; }
    html += card(r);
  });
  $("list").innerHTML = html;
}
function renderAll(){ renderTabs(); renderTally(); renderAreas(); renderNear(); renderChips(); renderList(); $("sort").value = st.sort; }

function toast(msg, undo){
  last = undo; $("tmsg").textContent = msg; $("toast").classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => $("toast").classList.remove("on"), 5000);
}
const busy = {};
async function write(id, v){
  if(local){ try{ localStorage.setItem("kw-picks", JSON.stringify(picks)); }catch(e){} return; }
  if(!db) return;
  while(busy[id]) await busy[id];
  const ref = db.doc("picks/" + id);
  busy[id] = (v ? ref.set({s:v, t:Date.now()}) : ref.delete()).catch(e => {
    $("sync").textContent = e && e.code==="quota_exceeded" ? "Storage is full; this pick was not saved." : "Couldn't save that pick. Check your connection.";
  }).finally(() => { busy[id] = null; });
  await busy[id];
}
function setPick(id, v){
  const prev = picks[id] || "";
  const next = prev===v ? "" : v;
  if(next) picks[id] = next; else delete picks[id];
  renderTabs(); renderTally(); renderList();
  write(id, next);
  const r = DATA.find(x => x.id===id);
  toast(next ? `${r.n}: ${next}` : `${r.n}: cleared`, () => setPickRaw(id, prev));
}
function setPickRaw(id, v){
  if(v) picks[id] = v; else delete picks[id];
  renderTabs(); renderTally(); renderList(); write(id, v);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.t){ st.tab = t.dataset.t; st.area = ""; saveUi(); renderAll(); return; }
  if(t.dataset.g==="status"){ st.status = t.dataset.v; }
  else if(t.dataset.g==="kind"){ st.kind = t.dataset.v; }
  else if(t.dataset.g==="star"){ st.star = !st.star; }
  else if(t.dataset.id){ setPick(t.dataset.id, t.dataset.v); return; }
  else if(t.id==="undo"){ if(last){ const u = last; last = null; u(); } $("toast").classList.remove("on"); return; }
  else return;
  saveUi(); renderChips(); renderList();
});
$("q").addEventListener("input", e => { st.q = e.target.value; renderList(); });
$("area").addEventListener("change", e => { st.area = e.target.value; saveUi(); renderList(); });
$("sort").addEventListener("change", e => { st.sort = e.target.value; saveUi(); renderList(); });
$("locate").addEventListener("click", () => {
  if(!navigator.geolocation){ $("sync").textContent = "This browser can't share your location."; return; }
  $("locate").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(p => {
    GPS = [p.coords.latitude, p.coords.longitude]; st.near = "gps"; st.tab = "near";
    $("locate").textContent = "Update my location"; renderAll();
  }, () => { $("locate").textContent = "Use my location"; $("sync").textContent = "Location was blocked. Allow it for this site in your browser settings, or pick a place from the list."; }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
});
$("near").addEventListener("change", e => { st.near = e.target.value; saveUi(); renderTally(); renderList(); });
$("rad").addEventListener("change", e => { st.rad = +e.target.value; saveUi(); renderTally(); renderList(); });

renderAll();

function useLocal(msg){
  local = true;
  try{ Object.assign(picks, JSON.parse(localStorage.getItem("kw-picks")||"{}")); }catch(e){}
  $("sync").textContent = msg; renderAll();
}
(() => {
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem("kw-picks")||"null"); }catch(e){}
  Object.assign(picks, saved || SEED);
  local = true;
  $("sync").textContent = saved ? "Picks saved on this device." : "Picks copied from your Claude app on Nov 19. Changes here save on this device.";
  renderAll();
})();
}
